<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản tin truyền thông đội ngũ kinh doanh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F5F1;--card:#fff;--ink:#2B2B2B;--mute:#6A6560;--line:#E4DDD4;--acc:#A04F05;--accbg:#FCEBD6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1815;--card:#242120;--ink:#EFEAE4;--mute:#B0A79C;--line:#3A3530;--acc:#F5A855;--accbg:#43301A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1815;--card:#242120;--ink:#EFEAE4;--mute:#B0A79C;--line:#3A3530;--acc:#F5A855;--accbg:#43301A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:26px;line-height:1.3;margin:0 0 20px;font-weight:600;text-align:center}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 260px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.banner{display:block;width:100%;height:auto;border-radius:12px;margin:0 0 20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 14px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--card)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.tabs button{flex:1 1 90px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 18px;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13.5px}
.chips button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:500}
.mon{font-size:13px;font-weight:600;color:var(--mute);margin:20px 0 8px}
.item{display:grid;grid-template-columns:96px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px}
.d{font-weight:600}.d small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}
.txt{margin:0}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin:32px 0 0}
mark{background:#FFE066;color:#2B2B2B;border-radius:3px;padding:0 1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;color:var(--mute);font-size:13px;margin-top:8px}
.tag{background:var(--accbg);color:var(--acc);border-radius:6px;padding:1px 8px;font-weight:500}
a{color:var(--acc);font-weight:500}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.empty{padding:36px 8px;color:var(--mute);text-align:center}
@media (max-width:560px){.item{grid-template-columns:1fr;gap:6px}h1{font-size:22px}}
</style>
</head>

const GROUPS=['Tất cả','Sản phẩm','Vận hành','Cơ chế','Đào tạo','Khác'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const fd=i=>i.split('-').reverse().join('/');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>{const q=norm(S.q.trim());if(!q)return esc(s);let n='',map=[];for(let i=0;i<s.length;i++){const c=norm(s[i]);for(let k=0;k<c.length;k++){n+=c[k];map.push(i)}}let out='',pos=0,from=0,j;while((j=n.indexOf(q,from))>-1){const a=map[j],b=map[j+q.length-1]+1;if(a<pos){from=j+1;continue}out+=esc(s.slice(pos,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';pos=b;from=j+q.length}return out+esc(s.slice(pos))};
const effT=e=>e.t==='d'?fd(e.v):e.v;
const src=x=>x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Nguồn tham khảo</a>`:'';
DATA.forEach(x=>x.s=norm([x.cat,x.txt,fd(x.date),effT(x.eff),x.ch].join(' ')));
const S={g:'Tất cả',t:'Tất cả',q:'',m:'Tất cả'};
const $=id=>document.getElementById(id);
function render(){
  const q=norm(S.q.trim());
  const base=DATA.filter(x=>(S.m==='Tất cả'||x.date.startsWith(S.m))&&(!q||x.s.includes(q)));
  $('tabs').innerHTML=GROUPS.map(g=>`<button role="tab" aria-selected="${S.g===g}" data-g="${g}">${g}</button>`).join('');
  const topics=[...new Set(DATA.filter(x=>x.g==='Sản phẩm').map(x=>x.t))];
  $('chips').innerHTML=S.g==='Sản phẩm'?['Tất cả',...topics].map(t=>`<button aria-pressed="${S.t===t}" data-t="${t}">${t}</button>`).join(''):'';
  const items=base.filter(x=>(S.g==='Tất cả'||x.g===S.g)&&(S.g!=='Sản phẩm'||S.t==='Tất cả'||x.t===S.t));
  if(!items.length){$('list').innerHTML='<div class="empty">Không có tin phù hợp. Xóa từ khóa hoặc chọn nhóm khác.</div>';return}
  let out='',last='';
  items.forEach(x=>{
    const m=`Tháng ${+x.date.slice(5,7)}/${x.date.slice(0,4)}`;
    if(m!==last){out+=`<h2 class="mon">${m}</h2>`;last=m}
    out+=`<article class="item"><div class="d">${hl(fd(x.date))}</div><div><p class="txt">${hl(x.txt)}</p><div class="meta"><span class="tag">${hl(x.cat)}</span><span>Hiệu lực: ${hl(effT(x.eff))}</span><span>Email gửi: ${hl(x.ch)}</span>${src(x)}</div></div></article>`;
  });
  $('list').innerHTML=out;
}
const MS=[...new Set(DATA.map(x=>x.date.slice(0,7)))].sort().reverse();
$('m').innerHTML='<option value="Tất cả">Tất cả thời gian</option>'+MS.map(k=>`<option value="${k}">Tháng ${+k.slice(5)}/${k.slice(0,4)}</option>`).join('');
$('m').addEventListener('change',e=>{S.m=e.target.value;render()});
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.g){S.g=b.dataset.g;S.t='Tất cả'}
  else if(b.dataset.t){S.t=b.dataset.t}
  else return;
  render();
});
render();
</script>
